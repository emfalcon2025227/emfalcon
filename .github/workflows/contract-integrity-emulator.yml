name: Contract Integrity Emulator Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/tests/leaseRenewalAdminFeeIntegritySuite.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/contract-integrity-emulator.yml"

jobs:
  contract-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Run Contract Integrity Suite in Firestore Emulator
        run: |
          npx --yes firebase-tools@latest emulators:exec \
            --project contract-integrity-test \
            --only firestore \
            "npm run test:contract-integrity"
